prospectus:
  title: LITS Admissions Guide — Fall 2027
  sections:
    - heading: About LITS
      body: |
        Lahore Institute of Technology & Sciences is an HEC-recognized private university on Raiwind Road, Lahore, with schools of Computing, Engineering and Business. BS Electrical Engineering is accredited by the Pakistan Engineering Council (PEC).
    - heading: How to apply
      body: |
        Apply online at https://admissions.lits.edu.pk/apply and pay the PKR 3,000 processing fee. Upload your Matric and FSc/Intermediate result cards (or Part-I marks if Part-II result is awaited), CNIC/B-Form and a photograph.
        Applicants awaiting their Part-II result may apply on the basis of Part-I marks; admission stays provisional until the final result.
    - heading: Entry test and merit
      body: |
        The LITS entry test covers Mathematics, English and Analytical Reasoning. NTS NAT and SAT scores are also accepted.
        Merit = 50% FSc/Intermediate marks + 40% entry test + 10% Matric marks. Three merit lists are published; seats left after the third list are offered on a waiting-list basis.
    - heading: Fee structure (per semester)
      body: |
        BS Computer Science PKR 145,000. BS Software Engineering PKR 140,000. BS Electrical Engineering PKR 150,000. BBA PKR 120,000. MS Computer Science PKR 110,000.
        One-time admission fee PKR 25,000. Fees are payable per semester; an installment plan of two parts per semester is available on request.
    - heading: Scholarships and financial aid
      body: |
        Need-based financial aid covers up to 100% of tuition after an income assessment and interview. Merit scholarships of 25% to 75% are awarded automatically on admission merit.
        Scholarships continue if the student keeps a CGPA of 3.0 or higher.
    - heading: Hostel
      body: |
        Separate hostels for male and female students are on campus. Shared room: PKR 35,000 per semester, mess charges separate. Rooms are allotted after admission on a first-come basis.
