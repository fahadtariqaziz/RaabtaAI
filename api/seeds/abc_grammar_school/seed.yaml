prospectus:
  title: ABC Grammar School — Prospectus 2026–27
  sections:
    - heading: Welcome
      body: |
        ABC Grammar School has served families in Lahore since 1998. We teach from Playgroup to Class 10 (Matric, BISE Lahore) in a co-educational, English-medium setting with strong Urdu and Islamiat teaching.
        Our campus at 45-B Gulberg III has air-conditioned classrooms, a science lab, a computer lab, a library and a covered play area.
    - heading: School timings
      body: |
        Classes run Monday to Friday, 07:45 to 13:30. Playgroup, Nursery and Prep finish at 12:00.
        The admissions office is open Monday to Saturday, 08:00 to 15:00.
        Winter timings (December–February) start at 08:15.
    - heading: Admission procedure
      body: |
        1. Book a campus visit or collect the admission form from the office (form fee PKR 2,000).
        2. Playgroup to Prep: interview of the child with a parent. Class 1 to Class 9: written admission test in English, Urdu and Maths.
        3. Successful candidates receive an offer letter. Admission is confirmed when the admission fee, security deposit and first month's tuition are paid.
        Documents: B-Form of the child, CNIC copies of both parents, last school's result card and school leaving certificate (Class 1 and above), four passport-size photographs.
    - heading: Age criteria
      body: |
        Playgroup: 2 years 9 months to 3 years 6 months on 1 April. Nursery: 3 years 6 months to 4 years 6 months. Prep: 4 years 6 months to 5 years 6 months.
    - heading: Fee policy
      body: |
        Tuition is billed monthly and is due by the 10th of each month. A late payment surcharge of PKR 500 applies after the due date.
        Fees can be paid at any Meezan Bank branch using the fee voucher, or through the bank app using the voucher number.
        Annual charges are billed with the April voucher. The security deposit is refunded within 60 days of the clearance certificate.
    - heading: Uniform
      body: |
        Boys: white shirt with school monogram, grey trousers, navy sweater in winter, black shoes.
        Girls: white shirt with school monogram, grey skirt or shalwar, navy sweater in winter, black shoes.
        Uniform is available from the school shop on campus.
    - heading: Transport
      body: |
        Air-conditioned vans run on four routes: DHA, Gulberg, Johar Town and Model Town. Seats are limited and given on a first-come basis. Transport fee is charged for 12 months.
    - heading: Policies
      body: |
        Minimum attendance of 85% is required for promotion. Mobile phones are not allowed in class.
        Parent–teacher meetings are held after every term. The school follows the Punjab Curriculum and Textbook Board syllabus with Oxford supplementary books.
    - heading: داخلہ کا طریقہ کار
      lang: ur
      body: |
        داخلہ فارم اسکول کے دفتر سے پیر تا ہفتہ صبح آٹھ بجے سے سہ پہر تین بجے تک حاصل کیا جا سکتا ہے۔
        کلاس اول سے نہم تک داخلہ ٹیسٹ انگریزی، اردو اور ریاضی میں ہوتا ہے۔
        داخلہ فیس، سیکیورٹی اور پہلے مہینے کی ٹیوشن فیس جمع کروانے پر داخلہ کنفرم ہو جاتا ہے۔
