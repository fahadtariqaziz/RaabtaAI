prospectus:
  title: Punjab Model College — Prospectus 2027–29
  sections:
    - heading: About the college
      body: |
        Punjab Model College, Faisalabad offers intermediate programs affiliated with BISE Faisalabad: FSc Pre-Medical, FSc Pre-Engineering, ICS and ICom. Separate campuses for boys and girls share the same faculty and labs.
        The college has no hostel. Students from outside Faisalabad usually stay in private hostels near Susan Road.
    - heading: Eligibility
      body: |
        FSc Pre-Medical: Matric (Science) with at least 70% marks. FSc Pre-Engineering and ICS: at least 60%. ICom: Matric in any group with at least 60%.
        Admission is on merit. Merit = Matric marks + entry interview. Hafiz-e-Quran candidates get 20 extra marks.
    - heading: Admission schedule
      body: |
        Admissions open after the BISE Matric result, usually in late August. Students may apply provisionally on the basis of their Matric result card printout.
        Merit lists are displayed on the notice board and the website. Classes begin on 1 October.
    - heading: Fee structure
      body: |
        Admission fee PKR 15,000 (one time). Monthly tuition: FSc Pre-Medical PKR 11,000; FSc Pre-Engineering PKR 10,500; ICS PKR 9,500; ICom PKR 8,000.
        Board registration and exam fee of PKR 6,500 is collected each year on behalf of BISE.
        Fee is due by the 10th of each month at HBL or through JazzCash using the voucher number.
    - heading: Scholarships
      body: |
        Students with 90% or more marks in Matric get a 50% tuition waiver. Students with 80% to 89.99% get 25%. Waivers continue in second year if the first-year result stays above 80%.
    - heading: Counselling
      body: |
        Free career counselling sessions (30 minutes) are available Monday to Friday, 11:00 to 14:00. Parents are welcome. Please book in advance.
    - heading: داخلے کے لیے ضروری کاغذات
      lang: ur
      body: |
        میٹرک کا رزلٹ کارڈ، ب فارم یا شناختی کارڈ کی کاپی، والد کے شناختی کارڈ کی کاپی اور چار تصاویر۔
        ہاسٹل کی سہولت دستیاب نہیں ہے۔
