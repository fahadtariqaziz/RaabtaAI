<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Punjab Model College — WordPress-like embed test</title>
  <!-- Aggressive theme CSS like many WP themes: global resets, !important, high z-index header. -->
  <style>
    *{box-sizing:content-box!important;font-family:"Comic Sans MS",cursive!important}
    button{background:red!important;color:yellow!important;border:3px solid black!important}
    input,textarea{font-size:22px!important}
    div{line-height:3!important}
    header{position:fixed;top:0;left:0;right:0;height:64px;background:#222;color:#fff;z-index:99999}
    main{margin-top:90px;padding:0 20px}
    .wp-block-group{padding:40px;background:#f5f5f5}
  </style>
</head>
<body class="home page-template-default">
  <header><div class="site-title">Punjab Model College</div></header>
  <main>
    <div class="wp-block-group"><h2>Admissions 2026</h2><p>Theme CSS above must not affect the widget.</p></div>
    <div style="height:1400px"></div>
  </main>
  <!-- Typical "insert in footer" plugin placement -->
  <script src="/widget/v1/widget.js" data-institution="punjab-model-college" data-position="left" async></script>
</body>
</html>
