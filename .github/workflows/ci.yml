# Minimal CI (user request 2026-11-01): only what catches real breakage.
# Deferred to Phase 8: security scans, integration tests with services, live evals.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: evals-smoke (datasets + cassette replay, no spend)
        env:
          DATABASE_URL: postgresql+asyncpg://nobody:nobody@127.0.0.1:1/none
          REDIS_URL: redis://127.0.0.1:1/0
          JWT_SECRET: ci-smoke-0123456789abcdef0123456789
        run: |
          uv run python -m evals.run_evals --suite agent --validate
          # replay suites a live `--mode record` run fully recorded (marker files)
          for s in router tone; do
            if [ -f "evals/cassettes/suites/$s.json" ]; then
              uv run python -m evals.run_evals --suite "$s" --mode replay
            fi
          done

  web:
    name: Admin + widget (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C admin lint
      - run: pnpm -C admin typecheck
      - run: pnpm -C admin build
      - run: pnpm -C widget typecheck
      - run: pnpm -C widget build
      - run: pnpm -C widget size
